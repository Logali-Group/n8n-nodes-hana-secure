# Publishes this n8n community node package to npm on every version tag push.
#
# Publishes from a public GitHub repository through npm Trusted Publishing.
# OIDC avoids long-lived npm tokens and automatically produces provenance.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# OIDC Trusted Publishing (no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: <your-github-username-or-org>
#        Repository name:  <your-repo-name>
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Allow `npm publish` for the trusted publisher.
#
# First-publication bootstrap:
#   npm cannot attach a Trusted Publisher until the package exists. For the
#   first tag only, create a short-lived granular npm token with publish access
#   and store it as the repository secret NPM_TOKEN. The workflow publishes
#   with GitHub provenance, then the token must be deleted after Trusted
#   Publishing is configured. Later releases use OIDC without a token.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow uses GitHub release tags with a "v" prefix (for example v0.4.0).
# The verification step removes only that leading prefix before comparing the tag
# with package.json.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Update the version and changelog in a reviewed pull request, then push the
# matching version tag. The workflow below performs a non-interactive publish.

name: Publish

on:
  push:
    tags:
      # Matches v0.1.0, v1.2.3, v2.0.0-rc.1, etc.
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up npm with OIDC support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: 'npm ci'

      - name: Verify tag matches package version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"

      - name: Test
        run: npm test

      - name: Detect first-publication bootstrap
        id: publish-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish first version with temporary token
        if: steps.publish-auth.outputs.bootstrap == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Publish with npm Trusted Publishing
        if: steps.publish-auth.outputs.bootstrap == 'false'
        run: npm publish --access public
